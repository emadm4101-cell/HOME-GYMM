<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HOME GYM PRO</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap');

  :root {
    --bg: #09090b;
    --card: #121215;
    --surface: #18181c;
    --surface-2: #222228;
    --border: #27272a;
    --text: #ffffff;
    --muted: #a1a1aa;
    --blue: #3b82f6;
    --blue-dark: #2563eb;
    --blue-soft: rgba(59, 130, 246, 0.14);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 92px;
    user-select: none;
    overflow-x: hidden;
  }

  /* Splash Loading Screen */
  #splashScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #09090b;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    transition: opacity 0.45s ease, visibility 0.45s ease;
  }

  #splashScreen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .splash-logo-wrap {
    width: 84px;
    height: 84px;
    border-radius: 24px;
    background: #121216;
    border: 1.5px solid #27272a;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 35px rgba(59, 130, 246, 0.22);
    animation: pulseLogo 1.4s infinite ease-in-out;
  }

  .splash-logo-wrap svg {
    width: 44px;
    height: 44px;
    color: var(--blue);
  }

  @keyframes pulseLogo {
    0%, 100% { transform: scale(1); border-color: #27272a; }
    50% { transform: scale(1.06); border-color: var(--blue); }
  }

  .splash-title {
    font-size: 1.3rem;
    font-weight: 900;
    letter-spacing: 1px;
    color: #fff;
  }

  .splash-title span {
    color: var(--blue);
  }

  .splash-bar-track {
    width: 150px;
    height: 4px;
    background: #18181c;
    border-radius: 99px;
    overflow: hidden;
  }

  .splash-bar-fill {
    width: 0%;
    height: 100%;
    background: var(--blue);
    border-radius: 99px;
    transition: width 0.85s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Header */
  header {
    position: sticky;
    top: 0;
    z-index: 60;
    background: rgba(9, 9, 11, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
  }

  .header-inner {
    max-width: 540px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.98rem;
    font-weight: 900;
    letter-spacing: 0.4px;
    color: var(--text);
  }

  .brand svg {
    color: var(--blue);
    width: 22px;
    height: 22px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Top Calendar Icon Button */
  .cal-icon-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: #fff;
    height: 34px;
    padding: 0 11px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    font-size: 0.75rem;
    font-weight: 800;
    cursor: pointer;
    transition: 0.15s;
  }

  .cal-icon-btn:active,
  .cal-icon-btn.done-day {
    border-color: var(--blue);
    background: var(--blue-soft);
  }

  .cal-icon-btn svg {
    width: 16px;
    height: 16px;
    color: var(--blue);
  }

  .mode-toggle {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2px;
    gap: 2px;
  }

  .mode-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 0.7rem;
    font-weight: 800;
    padding: 4px 9px;
    border-radius: 7px;
    cursor: pointer;
    transition: 0.15s;
  }

  .mode-btn.active {
    background: var(--blue-dark);
    color: #fff;
  }

  /* Main Container */
  .container {
    max-width: 540px;
    margin: 0 auto;
    padding: 12px;
  }

  /* Split Title & Filter Chips */
  .split-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    padding: 0 2px;
  }

  .split-bar h1 {
    font-size: 1.02rem;
    font-weight: 900;
    color: #fff;
  }

  .split-bar span {
    font-size: 0.74rem;
    color: var(--blue);
    font-weight: 800;
  }

  .chips-row {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 6px;
    scrollbar-width: none;
  }

  .chips-row::-webkit-scrollbar {
    display: none;
  }

  .chip {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 12px;
    border-radius: 99px;
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 800;
    white-space: nowrap;
    cursor: pointer;
    transition: 0.15s;
  }

  .chip.active {
    background: var(--blue-soft);
    border-color: var(--blue);
    color: #fff;
  }

  /* Clean Minimalist Exercise Card */
  .ex-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .ex-card.done {
    border-color: var(--blue);
  }

  .ex-top {
    display: grid;
    grid-template-columns: 118px 1fr;
    gap: 12px;
    padding: 10px;
    align-items: center;
  }

  /* Exercise Media Box */
  .media-box {
    width: 118px;
    height: 112px;
    background: #0d0d10;
    border: 1px solid var(--border);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    flex-shrink: 0;
  }

  .real-wrap {
    width: 100%;
    height: 100%;
    position: relative;
  }

  .real-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(20%) contrast(1.05);
    transition: opacity 0.22s ease-in-out;
  }

  .real-img.f0 { opacity: 1; }
  .real-img.f1 { opacity: 0; }
  .real-wrap.step2 .real-img.f0 { opacity: 0; }
  .real-wrap.step2 .real-img.f1 { opacity: 1; }

  .anatomy-cv {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
    background: #0d0d10;
  }

  body.mode-anatomy .anatomy-cv {
    display: block;
  }

  body.mode-anatomy .real-wrap {
    display: none;
  }

  .num-tag {
    position: absolute;
    top: 5px;
    right: 5px;
    z-index: 4;
    background: rgba(9, 9, 11, 0.85);
    border: 1px solid var(--border);
    color: #fff;
    font-size: 0.62rem;
    font-weight: 900;
    padding: 1px 6px;
    border-radius: 5px;
  }

  .zoom-tag {
    position: absolute;
    bottom: 5px;
    left: 5px;
    z-index: 4;
    background: rgba(9, 9, 11, 0.85);
    color: var(--blue);
    width: 22px;
    height: 22px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Title & Quick Action Icons */
  .ex-info {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    gap: 10px;
    min-width: 0;
  }

  .ex-head-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }

  .ex-ar {
    font-size: 0.94rem;
    font-weight: 900;
    color: #fff;
    line-height: 1.3;
  }

  .ex-en {
    font-size: 0.7rem;
    color: var(--muted);
    font-weight: 700;
    display: block;
    margin-top: 2px;
  }

  .check-btn {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
  }

  .ex-card.done .check-btn {
    background: var(--blue-dark);
    border-color: var(--blue);
    color: #fff;
  }

  .meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .muscle-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: #fff;
    font-size: 0.68rem;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 7px;
  }

  .muscle-pill i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--blue);
    display: inline-block;
  }

  .icon-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--blue);
    height: 28px;
    padding: 0 9px;
    border-radius: 7px;
    font-family: inherit;
    font-size: 0.68rem;
    font-weight: 800;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }

  .icon-btn svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
  }

  /* Previous Session Faded Row (Right above KG Counter) */
  .prev-session-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 10px 2px;
    background: #0e0e11;
    border-top: 1px solid var(--border);
  }

  .prev-session-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.67rem;
    font-weight: 700;
    color: var(--muted);
    opacity: 0.62;
    cursor: pointer;
    transition: opacity 0.15s, color 0.15s;
  }

  .prev-session-badge:active {
    opacity: 1;
    color: var(--blue);
  }

  .prev-session-badge svg {
    width: 12px;
    height: 12px;
    color: var(--blue);
    flex-shrink: 0;
  }

  .prev-session-badge b {
    color: #e4e4e7;
    font-weight: 800;
  }

  .prev-copy-hint {
    font-size: 0.6rem;
    font-weight: 700;
    color: var(--blue);
    opacity: 0.55;
  }

  /* 3 Side-by-Side Counters (Weight KG | Sets | Reps) */
  .counters-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 5px 10px 10px;
    background: #0e0e11;
  }

  .counter-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 5px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .counter-label {
    font-size: 0.64rem;
    font-weight: 800;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .counter-label span {
    color: var(--blue);
    font-weight: 900;
  }

  .counter-ctrl {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: 2px;
  }

  .step-btn {
    width: 26px;
    height: 26px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--blue);
    font-size: 0.95rem;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transition: 0.12s;
  }

  .step-btn:active {
    background: var(--blue-dark);
    color: #fff;
  }

  .counter-input {
    width: 38px;
    background: transparent;
    border: none;
    color: #fff;
    font-family: inherit;
    font-size: 0.86rem;
    font-weight: 900;
    text-align: center;
    outline: none;
    -moz-appearance: textfield;
  }

  .counter-input::-webkit-outer-spin-button,
  .counter-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  /* Finish Workout Button Section */
  .finish-wrap {
    margin: 18px 0 8px;
  }

  .finish-btn {
    width: 100%;
    height: 52px;
    border-radius: 14px;
    border: 1px solid var(--blue);
    background: var(--blue-dark);
    color: #fff;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(37, 99, 235, 0.28);
    transition: 0.2s;
  }

  .finish-btn:active {
    transform: scale(0.98);
  }

  .finish-btn.completed {
    background: var(--surface);
    border-color: var(--blue);
    color: var(--blue);
    box-shadow: none;
  }

  .finish-btn svg {
    width: 20px;
    height: 20px;
  }

  /* Modals (Zoom, Calendar, Summary) */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.88);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal-card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    overflow: hidden;
  }

  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }

  .modal-head h3 {
    font-size: 0.92rem;
    font-weight: 900;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .modal-head h3 svg {
    width: 18px;
    height: 18px;
    color: var(--blue);
  }

  .close-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--blue);
    width: 30px;
    height: 30px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 900;
  }

  .modal-stage {
    width: 100%;
    aspect-ratio: 4/3;
    background: #070709;
    position: relative;
  }

  .modal-stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* Calendar Modal Content */
  .cal-modal-body {
    padding: 14px;
  }

  .cal-stats-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 0.78rem;
    color: var(--muted);
    font-weight: 700;
  }

  .cal-stats-row b {
    color: var(--blue);
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
  }

  .day-btn {
    padding: 7px 2px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 800;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    cursor: pointer;
    position: relative;
    transition: 0.15s;
  }

  .day-btn small {
    font-size: 0.56rem;
    font-weight: 700;
    color: var(--muted);
    opacity: 0.75;
  }

  .day-btn.active {
    background: var(--blue-soft);
    border-color: var(--blue);
    color: #fff;
  }

  .day-btn.active small {
    color: var(--blue);
    opacity: 1;
  }

  .day-btn.logged::after {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--blue);
    position: absolute;
    top: 4px;
    left: 4px;
  }

  /* Finish Summary Modal Content */
  .summary-body {
    padding: 20px 16px;
    text-align: center;
  }

  .summary-icon {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--blue-soft);
    border: 1.5px solid var(--blue);
    color: var(--blue);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
  }

  .summary-icon svg {
    width: 28px;
    height: 28px;
  }

  .summary-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin: 16px 0;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 6px;
  }

  .stat-card b {
    display: block;
    font-size: 1.05rem;
    font-weight: 900;
    color: var(--blue);
  }

  .stat-card span {
    font-size: 0.68rem;
    color: var(--muted);
    font-weight: 700;
  }

  /* Bottom Navigation */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 70;
    background: rgba(9, 9, 11, 0.96);
    backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
    padding: 6px 8px 12px;
  }

  .nav-grid {
    max-width: 540px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
  }

  .nav-btn {
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    font-family: inherit;
    padding: 6px 2px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 0.72rem;
    font-weight: 800;
    transition: 0.15s;
  }

  .nav-btn svg {
    width: 16px;
    height: 16px;
    color: var(--muted);
    transition: 0.15s;
  }

  .nav-btn.active {
    background: var(--surface);
    border-color: var(--border);
    color: #fff;
  }

  .nav-btn.active svg {
    color: var(--blue);
  }
</style>
</head>
<body>

<!-- Splash Screen with Animated Logo -->
<div id="splashScreen">
  <div class="splash-logo-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 6.5 17.5 17.5"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/>
    </svg>
  </div>
  <div class="splash-title">HOME <span>GYM</span></div>
  <div class="splash-bar-track">
    <div class="splash-bar-fill" id="splashBar"></div>
  </div>
</div>

<header>
  <div class="header-inner">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.5 6.5 17.5 17.5"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/>
      </svg>
      <span>HOME GYM</span>
    </div>

    <div class="header-actions">
      <!-- Top Calendar Icon Trigger -->
      <button class="cal-icon-btn" id="topCalBtn" onclick="openCalModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <span>يوم <b id="activeDayHeader">1</b></span>
      </button>

      <div class="mode-toggle">
        <button class="mode-btn active" id="modeRealBtn" onclick="setVisualMode('real')">فيديو</button>
        <button class="mode-btn" id="modeAnatomyBtn" onclick="setVisualMode('anatomy')">تشريح</button>
      </div>
    </div>
  </div>
</header>

<main class="container">
  <!-- Active Workout Split Header -->
  <div class="split-bar">
    <h1 id="splitTitle">الذراع</h1>
    <span id="splitMeta">8 تمارين</span>
  </div>

  <!-- Sub-muscle Filters -->
  <div class="chips-row" id="filterRow"></div>

  <!-- Exercise List -->
  <div id="exList"></div>

  <!-- Finish Workout Button -->
  <div class="finish-wrap">
    <button class="finish-btn" id="finishDayBtn" onclick="finishWorkoutDay()">

let store = JSON.parse(localStorage.getItem("homeGymMono_v7") || "{}");
let currentDay = Number(store.lastActiveDay) || 1;
let currentSplit = (currentDay - 1) % 5;
let currentFilter = "الكل";
let modalTimer = null;

function getSplitIndexForDay(day) {
  return (day - 1) % 5;
}

// Splash Screen Loader
window.addEventListener("DOMContentLoaded", () => {
  const bar = document.getElementById("splashBar");
  setTimeout(() => { if (bar) bar.style.width = "100%"; }, 60);
  setTimeout(() => {
    const splash = document.getElementById("splashScreen");
    if (splash) splash.classList.add("hide");
  }, 950);
});

function getLog(day, ex) {
  const key = `d${day}_${ex.id}`;
  const saved = store[key];
  return {
    kg: saved && saved.kg !== undefined ? saved.kg : ex.kg,
    sets: saved && saved.sets !== undefined ? saved.sets : ex.sets,
    reps: saved && saved.reps !== undefined ? saved.reps : ex.reps,
    done: saved && saved.done ? true : false
  };
}

// Find the most recent logged entry for this exercise prior to currentDay
function getPreviousSessionLog(day, ex) {
  for (let d = day - 1; d >= 1; d--) {
    const saved = store[`d${d}_${ex.id}`];
    if (saved && (saved.done || saved.touched || store[`day_done_${d}`])) {
      return {
        day: d,
        kg: saved.kg !== undefined ? saved.kg : ex.kg,
        sets: saved.sets !== undefined ? saved.sets : ex.sets,
        reps: saved.reps !== undefined ? saved.reps : ex.reps
      };
    }
  }
  return null;
}

function applyPrevSession(exId, kg, sets, reps) {
  const kgIn = document.getElementById(`in_kg_${exId}`);
  const setsIn = document.getElementById(`in_sets_${exId}`);
  const repsIn = document.getElementById(`in_reps_${exId}`);
  if (kgIn) kgIn.value = kg;
  if (setsIn) setsIn.value = sets;
  if (repsIn) repsIn.value = reps;

  const ex = findEx(exId);
  const key = `d${currentDay}_${exId}`;
  const cur = getLog(currentDay, ex);
  cur.kg = kg;
  cur.sets = sets;
  cur.reps = reps;
  cur.touched = true;
  store[key] = cur;
  localStorage.setItem("homeGymMono_v7", JSON.stringify(store));
}

function isDayFinished(day) {
  return Boolean(store[`day_done_${day}`]);
}

function updateLog(exId, field, value) {
  const ex = findEx(exId);
  const key = `d${currentDay}_${exId}`;
  const cur = getLog(currentDay, ex);
  cur[field] = field === "done" ? Boolean(value) : Math.max(0, value);
  cur.touched = true;
  store[key] = cur;
  localStorage.setItem("homeGymMono_v7", JSON.stringify(store));
  renderCalendar();
  updateFinishButtonState();
}

function stepValue(exId, field, delta) {
  const input = document.getElementById(`in_${field}_${exId}`);
  if (!input) return;
  const next = Math.max(0, (Number(input.value) || 0) + delta);
  input.value = next;
  updateLog(exId, field, next);
}

function findEx(exId) {
  for (const s of SPLITS) {
    for (const e of s.exercises) if (e.id === exId) return e;
  }
  return { id: exId, kg: 10, sets: 4, reps: 12 };
}

function setVisualMode(mode) {
  document.body.classList.toggle("mode-anatomy", mode === "anatomy");
  document.getElementById("modeRealBtn").classList.toggle("active", mode === "real");
  document.getElementById("modeAnatomyBtn").classList.toggle("active", mode === "anatomy");
}

// Calendar Modal Functions
function openCalModal() {
  renderCalendar();
  document.getElementById("calModal").classList.add("open");
}

function closeCalModal() {
  document.getElementById("calModal").classList.remove("open");
}

function updateBottomNavHighlight() {
  for (let i = 0; i < 5; i++) {
    const navEl = document.getElementById("nav" + i);
    if (navEl) navEl.classList.toggle("active", i === currentSplit);
  }
}

function renderCalendar() {
  const splitName = SPLIT_SHORT_NAMES[getSplitIndexForDay(currentDay)];
  document.getElementById("activeDayHeader").textContent = `${currentDay} (${splitName})`;
  const topBtn = document.getElementById("topCalBtn");
  if (topBtn) topBtn.classList.toggle("done-day", isDayFinished(currentDay));

  let completedDays = 0;
  const grid = document.getElementById("calGrid");
  let html = "";
  for (let d = 1; d <= 30; d++) {
    const hasLog = isDayFinished(d) || Object.keys(store).some(k => k.startsWith(`d${d}_`) && store[k].done);
    if (hasLog) completedDays++;
    const daySplitLabel = SPLIT_SHORT_NAMES[getSplitIndexForDay(d)];
    html += `
      <button class="day-btn ${d === currentDay ? 'active' : ''} ${hasLog ? 'logged' : ''}" onclick="selectDay(${d})">
        <span>${d}</span>
        <small>${daySplitLabel}</small>
      </button>
    `;
  }
  if (grid) grid.innerHTML = html;
  const totalEl = document.getElementById("calTotalDone");
  if (totalEl) totalEl.innerHTML = `<b>${completedDays}</b> / 30 مكتمل`;
}

function selectDay(d) {
  currentDay = d;
  currentSplit = getSplitIndexForDay(d);
  currentFilter = "الكل";
  store.lastActiveDay = currentDay;
  localStorage.setItem("homeGymMono_v7", JSON.stringify(store));
  updateBottomNavHighlight();
  renderCalendar();
  renderExercises();
  closeCalModal();
}

function selectSplit(idx) {
  currentSplit = idx;
  currentFilter = "الكل";
  updateBottomNavHighlight();
  renderExercises();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function selectFilter(m) {
  currentFilter = m;
  renderExercises();
}

function updateFinishButtonState() {
  const btn = document.getElementById("finishDayBtn");
  const txt = document.getElementById("finishBtnText");
  if (!btn || !txt) return;
  const finished = isDayFinished(currentDay);
  btn.classList.toggle("completed", finished);
  txt.textContent = finished ? `تم إنهاء تمرين يوم ${currentDay} ✓` : `إنهاء تمرين اليوم (يوم ${currentDay})`;
}

function finishWorkoutDay() {
  const split = SPLITS[currentSplit];
  let totalSets = 0;
  let totalReps = 0;

  split.exercises.forEach(ex => {
    const cur = getLog(currentDay, ex);
    cur.done = true;
    cur.touched = true;
    store[`d${currentDay}_${ex.id}`] = cur;
    totalSets += Number(cur.sets) || 0;
    totalReps += (Number(cur.sets) || 0) * (Number(cur.reps) || 0);
  });

  store[`day_done_${currentDay}`] = true;
  localStorage.setItem("homeGymMono_v7", JSON.stringify(store));

  renderCalendar();
  renderExercises();

  document.getElementById("sumDayNum").textContent = `${currentDay} (${split.shortName})`;
  document.getElementById("sumExCount").textContent = split.exercises.length;
  document.getElementById("sumSetsCount").textContent = totalSets;
  document.getElementById("sumRepsCount").textContent = totalReps;
  document.getElementById("summaryModal").classList.add("open");
}

function advanceToNextDay() {
  closeSummaryModal();
  const nextD = currentDay < 30 ? currentDay + 1 : 1;
  selectDay(nextD);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function closeSummaryModal() {
  document.getElementById("summaryModal").classList.remove("open");
}

const activeCanvases = [];

function renderExercises() {
  activeCanvases.length = 0;
  const split = SPLITS[currentSplit];
  document.getElementById("splitTitle").textContent = `يوم ${currentDay}: ${split.title}`;

  const muscles = ["الكل", ...new Set(split.exercises.map(e => e.muscle))];
  document.getElementById("filterRow").innerHTML = muscles.map(m => `
    <button class="chip ${m === currentFilter ? 'active' : ''}" onclick="selectFilter('${m}')">${m}</button>
  `).join("");

  const list = currentFilter === "الكل"
    ? split.exercises
    : split.exercises.filter(e => e.muscle === currentFilter);

  document.getElementById("splitMeta").textContent = `${list.length} تمارين • جدول يوم ${currentDay}`;

  document.getElementById("exList").innerHTML = list.map((ex, idx) => {
    const log = getLog(currentDay, ex);
    const prev = getPreviousSessionLog(currentDay, ex);
    const f0 = `${DB_BASE}${ex.dbId}/0.jpg`;
    const f1 = `${DB_BASE}${ex.dbId}/1.jpg`;

    const prevBadgeHtml = prev
      ? `<div class="prev-session-bar" onclick="applyPrevSession('${ex.id}', ${prev.kg}, ${prev.sets}, ${prev.reps})">
           <div class="prev-session-badge">
             <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
             <span>آخر مرة (يوم ${prev.day}): <b>${prev.kg} KG</b> × <b>${prev.reps}</b> عدات (${prev.sets} مجاميع)</span>
           </div>
           <span class="prev-copy-hint">اضغط للنسخ</span>
         </div>`
      : `<div class="prev-session-bar">
           <div class="prev-session-badge" style="cursor:default;">
             <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
             <span>آخر مرة: <b>-- KG</b> × <b>--</b> عدات (أول مرة)</span>
           </div>
         </div>`;

    return `
      <article class="ex-card ${log.done ? 'done' : ''}" id="card_${ex.id}">
        <div class="ex-top">
          <div class="media-box" onclick="openModal('${ex.id}')">
            <span class="num-tag">#${idx + 1}</span>
            <span class="zoom-tag">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
            </span>
            <div class="real-wrap" id="real_${ex.id}">
              <img class="real-img f0" src="${f0}" alt="${ex.en}" loading="lazy"
                   onerror="this.parentElement.style.display='none'; document.getElementById('cv_${ex.id}').style.display='block';">
              <img class="real-img f1" src="${f1}" alt="${ex.en}" loading="lazy">
            </div>
            <canvas class="anatomy-cv" id="cv_${ex.id}" width="140" height="132"></canvas>
          </div>

          <div class="ex-info">
            <div class="ex-head-row">
              <div>
                <div class="ex-ar">${ex.ar}</div>
                <span class="ex-en">${ex.en}</span>
              </div>
              <button class="check-btn" onclick="toggleDone('${ex.id}')" aria-label="تم">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
              </button>
            </div>

            <div class="meta-row">
              <span class="muscle-pill"><i></i>${ex.muscle}</span>
              <a class="icon-btn" href="${ex.yt}" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <span>فيديو</span>
              </a>
            </div>
          </div>
        </div>

        ${prevBadgeHtml}

        <div class="counters-grid">
          <div class="counter-box">
            <div class="counter-label">الوزن <span>KG</span></div>
            <div class="counter-ctrl">
              <button class="step-btn" onclick="stepValue('${ex.id}', 'kg', -1)">−</button>
              <input class="counter-input" id="in_kg_${ex.id}" type="number" value="${log.kg}"
                     onchange="updateLog('${ex.id}', 'kg', Number(this.value))">
              <button class="step-btn" onclick="stepValue('${ex.id}', 'kg', 1)">+</button>
            </div>
          </div>

          <div class="counter-box">
            <div class="counter-label">المجاميع <span>SETS</span></div>
            <div class="counter-ctrl">
              <button class="step-btn" onclick="stepValue('${ex.id}', 'sets', -1)">−</button>
              <input class="counter-input" id="in_sets_${ex.id}" type="number" value="${log.sets}"
                     onchange="updateLog('${ex.id}', 'sets', Number(this.value))">
              <button class="step-btn" onclick="stepValue('${ex.id}', 'sets', 1)">+</button>
            </div>
          </div>

          <div class="counter-box">
            <div class="counter-label">العدات <span>REPS</span></div>
            <div class="counter-ctrl">
              <button class="step-btn" onclick="stepValue('${ex.id}', 'reps', -1)">−</button>
              <input class="counter-input" id="in_reps_${ex.id}" type="number" value="${log.reps}"
                     onchange="updateLog('${ex.id}', 'reps', Number(this.value))">
              <button class="step-btn" onclick="stepValue('${ex.id}', 'reps', 1)">+</button>
            </div>
          </div>
        </div>
      </article>
    `;
  }).join("");

  list.forEach(ex => {
    const cv = document.getElementById("cv_" + ex.id);
    if (cv) activeCanvases.push({ cv, ctx: cv.getContext("2d"), pose: ex.pose });
  });

  updateFinishButtonState();
}

function toggleDone(exId) {
  const ex = findEx(exId);
  const cur = getLog(currentDay, ex);
  updateLog(exId, "done", !cur.done);
  const card = document.getElementById("card_" + exId);
  if (card) card.classList.toggle("done", !cur.done);
}

// Automatic Stop-Motion Frame Loop
let stepToggle = false;
setInterval(() => {
  stepToggle = !stepToggle;
  document.querySelectorAll(".real-wrap").forEach(el => {
    el.classList.toggle("step2", stepToggle);
  });
}, 820);

// Modal Zoom
function openModal(exId) {
  const ex = findEx(exId);
  document.getElementById("modalTitle").textContent = `${ex.ar} (${ex.en})`;
  const img0 = document.getElementById("modalImg0");
  const img1 = document.getElementById("modalImg1");
  img0.src = `${DB_BASE}${ex.dbId}/0.jpg`;
  img1.src = `${DB_BASE}${ex.dbId}/1.jpg`;
  document.getElementById("zoomModal").classList.add("open");

  if (modalTimer) clearInterval(modalTimer);
  let s = false;
  modalTimer = setInterval(() => {
    s = !s;
    img1.style.opacity = s ? "1" : "0";
  }, 800);
}

function closeModal() {
  document.getElementById("zoomModal").classList.remove("open");
  if (modalTimer) clearInterval(modalTimer);
}

// Monochrome + Electric Blue Anatomy Renderer
function drawSegment(ctx, x1, y1, x2, y2, w, active) {
  ctx.strokeStyle = active ? "#3b82f6" : "#52525b";
  ctx.lineWidth = w;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function renderAnatomy(item, ts) {
  const { ctx, cv, pose } = item;
  ctx.clearRect(0, 0, cv.width, cv.height);
  const p = (Math.sin(ts * 0.004) + 1) * 0.5;

  ctx.strokeStyle = "#27272a";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(12, 118);
  ctx.lineTo(128, 118);
  ctx.stroke();

  if (pose === "floor") {
    drawSegment(ctx, 35, 108, 85, 108, 10, false);
    drawSegment(ctx, 85, 108, 112, 115, 8, false);
    drawSegment(ctx, 42, 104, 46, 86 - p * 22, 7, true);
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(24, 106, 7, 0, Math.PI * 2); ctx.fill();
  } else if (pose === "row") {
    drawSegment(ctx, 48, 76, 54, 116, 9, false);
    drawSegment(ctx, 48, 76, 84, 58, 11, true);
    drawSegment(ctx, 80, 60, 74 - p * 12, 86 - p * 18, 7, true);
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(94, 52, 7, 0, Math.PI * 2); ctx.fill();
  } else {
    drawSegment(ctx, 70, 44, 70, 82, 12, false);
    drawSegment(ctx, 70, 82, 70, 116, 9, false);
    const wy = pose === "overhead" ? (46 - p * 26) : (78 - p * 30);
    drawSegment(ctx, 70, 48, 86, 66, 7, true);
    drawSegment(ctx, 86, 66, 92, wy, 6, true);
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(70, 31, 8, 0, Math.PI * 2); ctx.fill();
  }
}

function loop(ts) {
  for (let i = 0; i < activeCanvases.length; i++) {
    renderAnatomy(activeCanvases[i], ts);
  }
  requestAnimationFrame(loop);
}

updateBottomNavHighlight();
renderCalendar();
renderExercises();
requestAnimationFrame(loop);
</script>
